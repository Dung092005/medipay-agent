services:
  - type: web
    name: medipay-api
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    maxShutdownDelaySeconds: 120
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: "https://medipay-web-ui.onrender.com,http://localhost:3000"
      - key: DATABASE_URL
        sync: false
      - key: RUNTIME_DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: medical_legal_active
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL_NAME
        sync: false
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "900"
      - key: EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: RETRIEVAL_TIMEOUT_SECONDS
        value: "45"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: RATE_LIMIT_REDIS_URL
        sync: false
      - key: METRICS_TOKEN
        sync: false
